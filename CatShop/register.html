<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CatShop</title>
    <link rel="icon" href="assets/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
<div class="container">
    <header>
        <nav>
            <div class="logo"><img src="assets/logo.png" alt="Logo CatShop"></div>
            <input type="checkbox" id="click">
            <label for="click" class="menu-btn"><i class="fas fa-bars"></i></label>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#categories">Categories</a></li>
                <li><a href="login.html" class="btn_login">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="center">
            <div class="form-login">
                <h3>Register</h3>
                <form action="login.html">
                    <input class="input" type="email" name="email" placeholder="Email" required>
                    <input class="input" type="text" name="username" placeholder="Username" required>
                    <input class="input" type="password" name="password" placeholder="Password" required>
                    <button type="submit" class="btn_login" name="register" id="register">Register</button>
                </form>
                <a href="login.html" class="link-register">Login Disini</a>
            </div>
        </div>
    </main>

    <footer><h4>&copy; Lab Pemrograman Komputer 2026</h4></footer>
</div>
</body>
</html>
