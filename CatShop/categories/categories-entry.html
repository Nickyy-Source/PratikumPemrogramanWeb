<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/logo.png">
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet">
    <title>CatShop Admin | Categories Entry</title>
</head>
<body>
<div class="sidebar">
    <div class="logo-details"><i class="bx bx-category"></i><span class="logo_name">CatShop</span></div>
    <ul class="nav-links">
        <li><a href="../admin.html"><i class="bx bx-grid-alt"></i><span class="links_name">Dashboard</span></a></li>
        <li><a href="categories.html" class="active"><i class="bx bx-box"></i><span class="links_name">Categories</span></a></li>
        <li><a href="../transaction/transaction.html"><i class="bx bx-list-ul"></i><span class="links_name">Transaction</span></a></li>
        <li><a href="../index.html"><i class="bx bx-log-out"></i><span class="links_name">Log out</span></a></li>
    </ul>
</div>

<section class="home-section">
    <nav>
        <div class="sidebar-button"><i class="bx bx-menu sidebarBtn"></i></div>
        <div class="profile-details"><span class="admin_name">CatShop Admin</span></div>
    </nav>
    <div class="home-content">
        <h3>Input Categories</h3>
        <div class="form-login">
            <form action="categories.html">
                <label for="categories">Categories</label>
                <input class="input" type="text" name="categories" id="categories" placeholder="Categories" required>
                <label for="price">Price</label>
                <input class="input" type="number" name="price" id="price" placeholder="Price" required>
                <label for="description">Description</label>
                <input class="input" type="text" name="description" id="description" placeholder="Description" required>
                <label for="photo">Photo</label>
                <input type="file" name="photo" id="photo" style="margin: 10px 0 20px" accept="image/*">
                <button type="submit" class="btn btn-simpan" name="simpan">Simpan</button>
            </form>
        </div>
    </div>
</section>

<script>
const sidebar = document.querySelector('.sidebar');
const sidebarBtn = document.querySelector('.sidebarBtn');
sidebarBtn.onclick = function () {
    sidebar.classList.toggle('active');
    if (sidebar.classList.contains('active')) sidebarBtn.classList.replace('bx-menu', 'bx-menu-alt-right');
    else sidebarBtn.classList.replace('bx-menu-alt-right', 'bx-menu');
};
</script>
</body>
</html>
