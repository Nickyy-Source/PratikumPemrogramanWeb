<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BirdTrainer</title>

        <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <div class="logo">
                Bird<span>Trainer</span>
            </div>

            <h1>Register</h1>

            <p class="deskripsi">
                Buat akun baru untuk menggunakan BirdTrainer.
            </p>

            <form action="login.html" method="get">

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama lengkap"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Masukkan email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="konfirmasi">Konfirmasi Password</label>
                    <input
                        type="password"
                        id="konfirmasi"
                        name="konfirmasi"
                        placeholder="Masukkan ulang password"
                        required
                    >
                </div>

                <div class="form-group">

                    <label>Jenis Kelamin</label>

                    <div class="gender">

                        <label>
                            <input
                                type="radio"
                                name="jenis_kelamin"
                                value="Laki-laki"
                                required
                            >
                            Laki-laki
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="jenis_kelamin"
                                value="Perempuan"
                            >
                            Perempuan
                        </label>

                    </div>

                </div>

                <button type="submit" class="btn-register">
                    Register
                </button>

            </form>

            <p class="login">
                Sudah punya akun?
                <a href="login.html">Login</a>
            </p>

            <a href="index.html" class="home">
                ← Kembali ke Beranda
            </a>

        </div>

    </div>

</body>
</html>
